<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" fill="none" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#B8CFB3" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#A8BFA3" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E8E2D6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="100%" y1="10%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#C8D6C5" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#A8BFA3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F5F1EA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6F8F6B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soften2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- base wash -->
  <rect width="390" height="844" fill="url(#ribbon3)"/>

  <!-- primary flowing ribbon  top-left sweep -->
  <path
    d="M-120 40
       C 40 10, 120 90, 240 55
       C 360 20, 460 110, 520 75
       C 580 40, 500 170, 380 210
       C 260 250, 100 180, -60 200
       C -140 210, -180 120, -120 40 Z"
    fill="url(#ribbon1)"
    filter="url(#soften)"
    opacity="0.85"
  />

  <!-- secondary ribbon  mid sweep -->
  <path
    d="M-80 160
       C 60 120, 180 240, 320 195
       C 440 158, 520 280, 420 340
       C 300 405, 120 320, -40 350
       C -120 365, -150 250, -80 160 Z"
    fill="url(#ribbon2)"
    filter="url(#soften2)"
    opacity="0.7"
  />

  <!-- accent arc  top-right glow -->
  <ellipse cx="310" cy="90" rx="160" ry="100" fill="#A8BFA3" filter="url(#soften2)" opacity="0.22"/>

  <!-- whisper line curves (reference-style) -->
  <path
    d="M-20 130 C 100 95, 200 165, 340 125 C 420 100, 480 155, 400 185"
    stroke="#6F8F6B"
    stroke-width="1.25"
    stroke-opacity="0.18"
    fill="none"
    stroke-linecap="round"
  />
  <path
    d="M-10 155 C 120 118, 230 195, 360 150 C 440 125, 500 178, 410 210"
    stroke="#A8BFA3"
    stroke-width="1"
    stroke-opacity="0.14"
    fill="none"
    stroke-linecap="round"
  />
  <path
    d="M0 178 C 130 142, 250 218, 370 172 C 450 148, 510 198, 420 228"
    stroke="#C8D6C5"
    stroke-width="0.85"
    stroke-opacity="0.12"
    fill="none"
    stroke-linecap="round"
  />
</svg>
