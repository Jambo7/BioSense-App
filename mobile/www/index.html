<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F7F5F0" />
    <title>BioSense</title>
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f5f0;
        color: #1a1c1a;
        font-family: system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        max-width: 28ch;
        color: #5c635c;
        line-height: 1.45;
        font-size: 15px;
      }
      a {
        margin-top: 20px;
        color: #6f8f6b;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BioSense</h1>
      <p>
        Offline or still connecting. Open the app again once you have a
        network — your health data lives securely in the cloud.
      </p>
      <a href="https://bio-sense-app-navy.vercel.app">Open BioSense</a>
    </main>
  </body>
</html>
